<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAS Trader Scripts Manager</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ============================================================
         🔥 FIREBASE SDK
         ============================================================ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore, collection, doc,
            getDocs, addDoc, updateDoc, deleteDoc,
            onSnapshot, serverTimestamp, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ============================================================
        // ⚙️  PON AQUÍ TU CONFIGURACIÓN DE FIREBASE
        //     (la encuentras en Firebase Console → Configuración del proyecto)
        // ============================================================
        const firebaseConfig = {
            apiKey:            "AIzaSyC2QR-gBJjy2iAI5iXB4E0goIh3256Lns4",
            authDomain:        "script-das-trader.firebaseapp.com",
            projectId:         "script-das-trader",
            storageBucket:     "script-das-trader.firebasestorage.app",
            messagingSenderId: "909739475600",
            appId:             "1:909739475600:web:10eca23e030c7497a9ce15",
            measurementId:     "G-6XPW9E0B4C"
        };

        const app = initializeApp(firebaseConfig);
        const db  = getFirestore(app);

        // Exponemos la db globalmente para que React la use
        window.__firebaseDB = db;
        window.__firebaseUtils = {
            collection, doc,
            getDocs, addDoc, updateDoc, deleteDoc,
            onSnapshot, serverTimestamp, query, orderBy
        };
        window.__firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-background-primary:   #ffffff;
            --color-background-secondary: #f7f6f3;
            --color-background-tertiary:  #f1efe8;
            --color-background-info:      #e6f1fb;
            --color-background-success:   #eaf3de;
            --color-background-danger:    #fcebeb;

            --color-text-primary:   #1a1a1a;
            --color-text-secondary: #666666;
            --color-text-tertiary:  #999999;
            --color-text-info:      #185fa5;
            --color-text-success:   #3b6d11;
            --color-text-danger:    #a32d2d;

            --color-border-tertiary:  rgba(0,0,0,0.15);
            --color-border-secondary: rgba(0,0,0,0.3);
            --color-border-primary:   rgba(0,0,0,0.4);

            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background-primary:   #1a1a1a;
                --color-background-secondary: #2a2a2a;
                --color-background-tertiary:  #333333;
                --color-background-info:      #0c447c;
                --color-background-success:   #27500a;
                --color-background-danger:    #791f1f;

                --color-text-primary:   #e8e8e8;
                --color-text-secondary: #b0b0b0;
                --color-text-tertiary:  #808080;
                --color-text-info:      #b5d4f4;
                --color-text-success:   #c0dd97;
                --color-text-danger:    #f7c1c1;

                --color-border-tertiary:  rgba(255,255,255,0.15);
                --color-border-secondary: rgba(255,255,255,0.3);
                --color-border-primary:   rgba(255,255,255,0.4);
            }
        }

        body { font-family: var(--font-sans); background: var(--color-background-tertiary); color: var(--color-text-primary); line-height: 1.5; }

        input, select, textarea, button {
            font-family: inherit; font-size: 14px; padding: 10px 12px;
            border: 0.5px solid var(--color-border-tertiary);
            border-radius: var(--border-radius-md);
            background: var(--color-background-primary); color: var(--color-text-primary);
            transition: border-color 0.2s, background 0.2s;
        }
        input:hover, select:hover, textarea:hover { border-color: var(--color-border-secondary); }
        input:focus, select:focus, textarea:focus  { outline: none; border-color: var(--color-border-primary); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
        button { cursor: pointer; font-weight: 400; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
        button:hover   { background: var(--color-background-secondary); }
        button:active  { transform: scale(0.98); }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        textarea { resize: vertical; min-height: 60px; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /* ── Iconos emoji fallback ── */
    const Icon = ({ name, size = 16 }) => (
        <span style={{ display:'inline-block', width:size, height:size, fontSize: size - 4 }}>
            {name === 'Search'   && '🔍'}
            {name === 'Plus'     && '➕'}
            {name === 'Edit2'    && '✏️'}
            {name === 'Trash2'   && '🗑️'}
            {name === 'Share2'   && '↗️'}
            {name === 'Copy'     && '📋'}
            {name === 'Check'    && '✓'}
            {name === 'Database' && '💾'}
            {name === 'Spinner'  && '⏳'}
        </span>
    );

    /* ── Toast de notificación ── */
    function Toast({ message, type }) {
        const colors = {
            success: { bg: 'var(--color-background-success)', color: 'var(--color-text-success)' },
            error:   { bg: 'var(--color-background-danger)',  color: 'var(--color-text-danger)'  },
            info:    { bg: 'var(--color-background-info)',    color: 'var(--color-text-info)'    },
        };
        return (
            <div style={{
                position:'fixed', bottom:'1.5rem', right:'1.5rem', zIndex:9999,
                padding:'12px 20px', borderRadius:'var(--border-radius-md)',
                fontSize:'14px', fontWeight:'500', maxWidth:'320px',
                background: colors[type]?.bg, color: colors[type]?.color,
                boxShadow:'0 4px 20px rgba(0,0,0,0.15)',
                animation:'slideIn 0.3s ease'
            }}>
                {message}
            </div>
        );
    }

    /* ── Modal genérico ── */
    function Modal({ title, onClose, onSave, saveLabel, saveDisabled, children }) {
        return (
            <div style={{
                position:'fixed', inset:0, background:'rgba(0,0,0,0.5)',
                display:'flex', alignItems:'center', justifyContent:'center',
                padding:'1rem', zIndex:1000
            }}>
                <div style={{
                    background:'var(--color-background-primary)', borderRadius:'var(--border-radius-lg)',
                    padding:'1.5rem', maxWidth:'600px', width:'100%', maxHeight:'90vh', overflowY:'auto'
                }}>
                    <h2 style={{ fontSize:'20px', fontWeight:'500', marginBottom:'1.5rem' }}>{title}</h2>
                    {children}
                    <div style={{ display:'flex', gap:'12px', marginTop:'1.5rem' }}>
                        <button
                            onClick={onSave}
                            disabled={saveDisabled}
                            style={{
                                flex:1, padding:'10px',
                                background:'var(--color-background-info)', color:'var(--color-text-info)',
                                border:'none', fontSize:'14px', fontWeight:'500',
                                cursor: saveDisabled ? 'not-allowed' : 'pointer',
                                opacity: saveDisabled ? 0.5 : 1
                            }}
                        >{saveLabel}</button>
                        <button onClick={onClose} style={{ flex:1, padding:'10px', fontSize:'14px' }}>Cancelar</button>
                    </div>
                </div>
            </div>
        );
    }

    /* ── Formulario de script reutilizable ── */
    const CATEGORIES = ['Entry', 'Exit', 'Management', 'Otros'];
    const EMPTY_FORM  = { name:'', code:'', description:'', category:'Entry' };

    function ScriptForm({ data, onChange }) {
        const set = (field) => (e) => onChange({ ...data, [field]: e.target.value });
        return (
            <div style={{ display:'flex', flexDirection:'column', gap:'1rem' }}>
                <div>
                    <label style={{ fontSize:'13px', color:'var(--color-text-secondary)', display:'block', marginBottom:'6px' }}>Nombre del script *</label>
                    <input type="text" value={data.name} onChange={set('name')} placeholder="Ej: Long Entry 100 shares" style={{ width:'100%' }} />
                </div>
                <div>
                    <label style={{ fontSize:'13px', color:'var(--color-text-secondary)', display:'block', marginBottom:'6px' }}>Categoría</label>
                    <select value={data.category} onChange={set('category')} style={{ width:'100%' }}>
                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                </div>
                <div>
                    <label style={{ fontSize:'13px', color:'var(--color-text-secondary)', display:'block', marginBottom:'6px' }}>Descripción</label>
                    <textarea value={data.description} onChange={set('description')} placeholder="Descripción breve..." rows={2} style={{ width:'100%' }} />
                </div>
                <div>
                    <label style={{ fontSize:'13px', color:'var(--color-text-secondary)', display:'block', marginBottom:'6px' }}>Código del script *</label>
                    <textarea value={data.code} onChange={set('code')} placeholder="Pega aquí tu código de DAS Trader..." rows={6}
                        style={{ width:'100%', fontFamily:'var(--font-mono)', fontSize:'13px' }} />
                </div>
            </div>
        );
    }

    /* ══════════════════════════════════════════════════════════════
       COMPONENTE PRINCIPAL
    ══════════════════════════════════════════════════════════════ */
    function DASTraderScripts() {
        const [scripts,        setScripts]        = useState([]);
        const [searchQuery,    setSearchQuery]    = useState('');
        const [categoryFilter, setCategoryFilter] = useState('Todos');
        const [showAddModal,   setShowAddModal]   = useState(false);
        const [editingScript,  setEditingScript]  = useState(null);
        const [copiedId,       setCopiedId]       = useState(null);
        const [firebaseReady,  setFirebaseReady]  = useState(false);
        const [loading,        setLoading]        = useState(true);
        const [saving,         setSaving]         = useState(false);
        const [toast,          setToast]          = useState(null);
        const [newScript,      setNewScript]      = useState(EMPTY_FORM);

        /* ── Firebase helpers ── */
        const getDB = () => window.__firebaseDB;
        const fu    = () => window.__firebaseUtils;

        const showToast = (message, type = 'success') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3000);
        };

        /* ── Conectar a Firebase en tiempo real ── */
        useEffect(() => {
            const init = () => {
                if (!window.__firebaseReady) return;
                setFirebaseReady(true);
                const { collection, onSnapshot, query, orderBy } = fu();
                const q = query(collection(getDB(), 'scripts'), orderBy('createdAt', 'desc'));
                const unsub = onSnapshot(q,
                    (snapshot) => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setScripts(data);
                        setLoading(false);
                    },
                    (err) => {
                        console.error(err);
                        showToast('Error conectando con Firebase. ¿Configuraste las credenciales?', 'error');
                        setLoading(false);
                    }
                );
                return unsub;
            };

            let unsub;
            if (window.__firebaseReady) {
                unsub = init();
            } else {
                window.addEventListener('firebase-ready', () => { unsub = init(); }, { once: true });
            }
            return () => unsub && unsub();
        }, []);

        /* ── CRUD ── */
        const handleAddScript = async () => {
            if (!newScript.name || !newScript.code) return;
            setSaving(true);
            try {
                const { collection, addDoc, serverTimestamp } = fu();
                await addDoc(collection(getDB(), 'scripts'), {
                    ...newScript,
                    shared: false,
                    createdAt: serverTimestamp()
                });
                setShowAddModal(false);
                setNewScript(EMPTY_FORM);
                showToast('Script guardado en Firebase ✓');
            } catch (e) {
                showToast('Error al guardar: ' + e.message, 'error');
            }
            setSaving(false);
        };

        const handleUpdateScript = async () => {
            if (!editingScript) return;
            setSaving(true);
            try {
                const { doc, updateDoc } = fu();
                const { id, ...data } = editingScript;
                await updateDoc(doc(getDB(), 'scripts', id), data);
                setEditingScript(null);
                showToast('Script actualizado ✓');
            } catch (e) {
                showToast('Error al actualizar: ' + e.message, 'error');
            }
            setSaving(false);
        };

        const handleDeleteScript = async (id) => {
            if (!confirm('¿Estás seguro de eliminar este script?')) return;
            try {
                const { doc, deleteDoc } = fu();
                await deleteDoc(doc(getDB(), 'scripts', id));
                showToast('Script eliminado', 'info');
            } catch (e) {
                showToast('Error al eliminar: ' + e.message, 'error');
            }
        };

        const handleToggleShare = async (script) => {
            try {
                const { doc, updateDoc } = fu();
                await updateDoc(doc(getDB(), 'scripts', script.id), { shared: !script.shared });
                showToast(script.shared ? 'Script no compartido' : 'Script marcado como compartido ✓');
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        };

        const handleCopyCode = (code, id) => {
            navigator.clipboard.writeText(code);
            setCopiedId(id);
            setTimeout(() => setCopiedId(null), 2000);
        };

        /* ── Filtros ── */
        const filtered = scripts.filter(s => {
            const matchSearch = s.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                s.description?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                s.code?.toLowerCase().includes(searchQuery.toLowerCase());
            const matchCat    = categoryFilter === 'Todos' || s.category === categoryFilter;
            return matchSearch && matchCat;
        });

        /* ── UI ── */
        return (
            <div style={{ maxWidth:'1200px', margin:'0 auto', padding:'2rem 1rem' }}>
                {/* Toast */}
                {toast && <Toast message={toast.message} type={toast.type} />}

                {/* Header */}
                <div style={{ marginBottom:'2rem' }}>
                    <h1 style={{ fontSize:'28px', fontWeight:'500', marginBottom:'8px' }}>DAS Trader Scripts</h1>
                    <p style={{ fontSize:'14px', color:'var(--color-text-secondary)' }}>
                        Gestiona tus scripts de trading — sincronizados en tiempo real con Firebase
                    </p>
                </div>

                {/* Estado Firebase */}
                <div style={{ display:'flex', gap:'12px', marginBottom:'1.5rem', flexWrap:'wrap', alignItems:'center' }}>
                    <div style={{
                        display:'flex', alignItems:'center', gap:'8px',
                        padding:'8px 12px', borderRadius:'var(--border-radius-md)', fontSize:'13px',
                        background: firebaseReady ? 'var(--color-background-success)' : 'var(--color-background-danger)',
                        color:      firebaseReady ? 'var(--color-text-success)'       : 'var(--color-text-danger)'
                    }}>
                        <Icon name="Database" size={16} />
                        {firebaseReady ? 'Firebase conectado ✓' : 'Firebase no configurado ✗'}
                    </div>
                    <span style={{ fontSize:'13px', color:'var(--color-text-tertiary)', marginLeft:'auto' }}>
                        {scripts.length} script{scripts.length !== 1 ? 's' : ''} en total
                    </span>
                </div>



                {/* Barra de búsqueda + botón añadir */}
                <div style={{ display:'flex', gap:'12px', marginBottom:'1rem', flexWrap:'wrap' }}>
                    <input
                        type="text"
                        placeholder="🔍 Buscar scripts por nombre, descripción o código..."
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        style={{ flex:1, minWidth:'200px' }}
                    />
                    <button
                        onClick={() => setShowAddModal(true)}
                        style={{
                            display:'flex', alignItems:'center', gap:'6px',
                            padding:'0 20px', fontSize:'14px',
                            background:'var(--color-background-info)', color:'var(--color-text-info)',
                            border:'none', fontWeight:'500'
                        }}
                    >
                        <Icon name="Plus" size={18} /> Agregar Script
                    </button>
                </div>

                {/* Filtro de categorías */}
                <div style={{ display:'flex', gap:'8px', marginBottom:'1.5rem', flexWrap:'wrap' }}>
                    {['Todos', ...CATEGORIES].map(cat => (
                        <button
                            key={cat}
                            onClick={() => setCategoryFilter(cat)}
                            style={{
                                padding:'6px 14px', fontSize:'13px', borderRadius:'var(--border-radius-md)',
                                background: categoryFilter === cat ? 'var(--color-background-info)' : 'var(--color-background-secondary)',
                                color:      categoryFilter === cat ? 'var(--color-text-info)'       : 'var(--color-text-secondary)',
                                border:     categoryFilter === cat ? 'none' : '0.5px solid var(--color-border-tertiary)',
                                fontWeight: categoryFilter === cat ? '500' : '400'
                            }}
                        >{cat}</button>
                    ))}
                </div>

                {/* Lista de scripts */}
                {loading ? (
                    <div style={{ textAlign:'center', padding:'4rem', color:'var(--color-text-secondary)' }}>
                        <Icon name="Spinner" size={24} /> Cargando desde Firebase...
                    </div>
                ) : filtered.length === 0 ? (
                    <div style={{ textAlign:'center', padding:'4rem', color:'var(--color-text-secondary)' }}>
                        {searchQuery || categoryFilter !== 'Todos'
                            ? 'No se encontraron scripts con ese filtro.'
                            : 'No hay scripts aún. ¡Agrega tu primer script!'}
                    </div>
                ) : (
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))', gap:'16px' }}>
                        {filtered.map(script => (
                            <div key={script.id} style={{
                                background:'var(--color-background-primary)',
                                border:'0.5px solid var(--color-border-tertiary)',
                                borderRadius:'var(--border-radius-lg)',
                                padding:'1rem', display:'flex', flexDirection:'column', gap:'12px'
                            }}>
                                {/* Cabecera tarjeta */}
                                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'start' }}>
                                    <div style={{ flex:1 }}>
                                        <h3 style={{ fontSize:'15px', fontWeight:'500', marginBottom:'4px' }}>{script.name}</h3>
                                        <span style={{
                                            fontSize:'12px', padding:'2px 8px',
                                            background:'var(--color-background-info)', color:'var(--color-text-info)',
                                            borderRadius:'var(--border-radius-md)', display:'inline-block'
                                        }}>{script.category}</span>
                                    </div>
                                    {script.shared && (
                                        <div style={{
                                            fontSize:'12px', padding:'4px 8px',
                                            background:'var(--color-background-success)', color:'var(--color-text-success)',
                                            borderRadius:'var(--border-radius-md)', display:'flex', alignItems:'center', gap:'4px'
                                        }}>
                                            <Icon name="Share2" size={12} /> Compartido
                                        </div>
                                    )}
                                </div>

                                {script.description && (
                                    <p style={{ fontSize:'13px', color:'var(--color-text-secondary)', margin:0 }}>{script.description}</p>
                                )}

                                {/* Código */}
                                <div style={{
                                    background:'var(--color-background-secondary)', padding:'12px',
                                    borderRadius:'var(--border-radius-md)', fontFamily:'var(--font-mono)',
                                    fontSize:'12px', overflowX:'auto', maxHeight:'120px', overflowY:'auto'
                                }}>
                                    <code style={{ whiteSpace:'pre-wrap', wordBreak:'break-all' }}>{script.code}</code>
                                </div>

                                {/* Acciones tarjeta */}
                                <div style={{ display:'flex', gap:'8px', paddingTop:'8px', borderTop:'0.5px solid var(--color-border-tertiary)' }}>
                                    <button
                                        onClick={() => handleCopyCode(script.code, script.id)}
                                        style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:'6px', padding:'8px', fontSize:'13px' }}
                                    >
                                        <Icon name={copiedId === script.id ? 'Check' : 'Copy'} size={16} />
                                        {copiedId === script.id ? 'Copiado' : 'Copiar'}
                                    </button>
                                    <button
                                        onClick={() => handleToggleShare(script)}
                                        title={script.shared ? 'Dejar de compartir' : 'Marcar como compartido'}
                                        style={{
                                            display:'flex', alignItems:'center', justifyContent:'center', padding:'8px',
                                            background: script.shared ? 'var(--color-background-success)' : 'var(--color-background-primary)',
                                            color:      script.shared ? 'var(--color-text-success)'       : 'var(--color-text-primary)'
                                        }}
                                    ><Icon name="Share2" size={16} /></button>
                                    <button
                                        onClick={() => setEditingScript(script)}
                                        style={{ display:'flex', alignItems:'center', justifyContent:'center', padding:'8px' }}
                                    ><Icon name="Edit2" size={16} /></button>
                                    <button
                                        onClick={() => handleDeleteScript(script.id)}
                                        style={{ display:'flex', alignItems:'center', justifyContent:'center', padding:'8px', color:'var(--color-text-danger)' }}
                                    ><Icon name="Trash2" size={16} /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}

                {/* Modal AÑADIR */}
                {showAddModal && (
                    <Modal
                        title="Agregar Nuevo Script"
                        onClose={() => { setShowAddModal(false); setNewScript(EMPTY_FORM); }}
                        onSave={handleAddScript}
                        saveLabel={saving ? 'Guardando...' : 'Guardar Script'}
                        saveDisabled={!newScript.name || !newScript.code || saving}
                    >
                        <ScriptForm data={newScript} onChange={setNewScript} />
                    </Modal>
                )}

                {/* Modal EDITAR */}
                {editingScript && (
                    <Modal
                        title="Editar Script"
                        onClose={() => setEditingScript(null)}
                        onSave={handleUpdateScript}
                        saveLabel={saving ? 'Guardando...' : 'Actualizar Script'}
                        saveDisabled={!editingScript.name || !editingScript.code || saving}
                    >
                        <ScriptForm data={editingScript} onChange={setEditingScript} />
                    </Modal>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DASTraderScripts />);
</script>

<style>
@keyframes slideIn {
    from { opacity:0; transform: translateY(10px); }
    to   { opacity:1; transform: translateY(0); }
}
</style>
</body>
</html>
