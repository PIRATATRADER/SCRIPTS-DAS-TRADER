<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAS Trader Scripts Manager</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase COMPAT — funciona sin type=module -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        firebase.initializeApp({
            apiKey:            "AIzaSyC2QR-gBJjy2iAI5iXB4E0goIh3256Lns4",
            authDomain:        "script-das-trader.firebaseapp.com",
            projectId:         "script-das-trader",
            storageBucket:     "script-das-trader.firebasestorage.app",
            messagingSenderId: "909739475600",
            appId:             "1:909739475600:web:10eca23e030c7497a9ce15"
        });
        window.__db = firebase.firestore();
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg0:#ffffff; --bg1:#f7f6f3; --bg2:#f1efe8;
            --bgI:#e6f1fb; --bgS:#eaf3de; --bgD:#fcebeb;
            --t0:#1a1a1a; --t1:#666; --t2:#999;
            --tI:#185fa5; --tS:#3b6d11; --tD:#a32d2d;
            --b1:rgba(0,0,0,0.12); --b2:rgba(0,0,0,0.28);
            --rM:8px; --rL:12px;
            --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            --mono:"SF Mono",Monaco,Consolas,"Courier New",monospace;
        }
        @media(prefers-color-scheme:dark){:root{
            --bg0:#1a1a1a;--bg1:#2a2a2a;--bg2:#333;
            --bgI:#0c447c;--bgS:#27500a;--bgD:#791f1f;
            --t0:#e8e8e8;--t1:#b0b0b0;--t2:#808080;
            --tI:#b5d4f4;--tS:#c0dd97;--tD:#f7c1c1;
            --b1:rgba(255,255,255,0.12);--b2:rgba(255,255,255,0.28);
        }}
        body{font-family:var(--sans);background:var(--bg2);color:var(--t0);line-height:1.5}
        input,select,textarea,button{font-family:inherit;font-size:14px;padding:10px 12px;
            border:.5px solid var(--b1);border-radius:var(--rM);
            background:var(--bg0);color:var(--t0);transition:border-color .2s}
        input:hover,select:hover,textarea:hover{border-color:var(--b2)}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
        button{cursor:pointer;border:.5px solid var(--b2)}
        button:hover{background:var(--bg1)} button:active{transform:scale(.98)}
        button:disabled{cursor:not-allowed;opacity:.5}
        textarea{resize:vertical;min-height:60px}
        @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const {useState,useEffect}=React;
    const CATS=['Entry','Exit','Management','Otros'];
    const EMPTY={name:'',code:'',description:'',category:'Entry'};
    const ICONS={search:'🔍',plus:'➕',edit:'✏️',trash:'🗑️',share:'↗️',copy:'📋',check:'✓',db:'💾',spin:'⏳'};
    const Ico=({n})=><span>{ICONS[n]||''}</span>;

    function Toast({msg,type}){
        const bg={success:'var(--bgS)',error:'var(--bgD)',info:'var(--bgI)'}[type];
        const cl={success:'var(--tS)',error:'var(--tD)',info:'var(--tI)'}[type];
        return <div style={{position:'fixed',bottom:'1.5rem',right:'1.5rem',zIndex:9999,
            padding:'12px 20px',borderRadius:'var(--rM)',fontSize:'14px',fontWeight:500,
            maxWidth:320,background:bg,color:cl,boxShadow:'0 4px 20px rgba(0,0,0,.15)',
            animation:'slideIn .3s ease'}}>{msg}</div>;
    }

    function Modal({title,onClose,onSave,label,disabled,children}){
        return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',
            display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem',zIndex:1000}}>
            <div style={{background:'var(--bg0)',borderRadius:'var(--rL)',
                padding:'1.5rem',maxWidth:600,width:'100%',maxHeight:'90vh',overflowY:'auto'}}>
                <h2 style={{fontSize:20,fontWeight:500,marginBottom:'1.5rem'}}>{title}</h2>
                {children}
                <div style={{display:'flex',gap:12,marginTop:'1.5rem'}}>
                    <button onClick={onSave} disabled={disabled} style={{flex:1,padding:10,
                        background:'var(--bgI)',color:'var(--tI)',border:'none',fontSize:14,fontWeight:500}}>{label}</button>
                    <button onClick={onClose} style={{flex:1,padding:10,fontSize:14}}>Cancelar</button>
                </div>
            </div>
        </div>;
    }

    function Form({data,onChange}){
        const s=f=>e=>onChange({...data,[f]:e.target.value});
        return <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
            <div>
                <label style={{fontSize:13,color:'var(--t1)',display:'block',marginBottom:6}}>Nombre *</label>
                <input value={data.name} onChange={s('name')} placeholder="Ej: Long Entry 100 shares" style={{width:'100%'}}/>
            </div>
            <div>
                <label style={{fontSize:13,color:'var(--t1)',display:'block',marginBottom:6}}>Categoría</label>
                <select value={data.category} onChange={s('category')} style={{width:'100%'}}>
                    {CATS.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
            </div>
            <div>
                <label style={{fontSize:13,color:'var(--t1)',display:'block',marginBottom:6}}>Descripción</label>
                <textarea value={data.description} onChange={s('description')} placeholder="Descripción breve..." rows={2} style={{width:'100%'}}/>
            </div>
            <div>
                <label style={{fontSize:13,color:'var(--t1)',display:'block',marginBottom:6}}>Código del script *</label>
                <textarea value={data.code} onChange={s('code')} placeholder="Pega aquí tu código DAS Trader..." rows={6}
                    style={{width:'100%',fontFamily:'var(--mono)',fontSize:13}}/>
            </div>
        </div>;
    }

    function App(){
        const [scripts,setScripts]=useState([]);
        const [search,setSearch]=useState('');
        const [cat,setCat]=useState('Todos');
        const [showAdd,setShowAdd]=useState(false);
        const [editing,setEditing]=useState(null);
        const [copied,setCopied]=useState(null);
        const [ready,setReady]=useState(false);
        const [loading,setLoading]=useState(true);
        const [saving,setSaving]=useState(false);
        const [toast,setToast]=useState(null);
        const [form,setForm]=useState(EMPTY);

        const col=()=>window.__db.collection('scripts');
        const notify=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000)};

        useEffect(()=>{
            if(!window.__db){notify('Firebase no disponible','error');setLoading(false);return;}
            setReady(true);
            const unsub=col().orderBy('createdAt','desc').onSnapshot(
                snap=>{setScripts(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);},
                err=>{console.error(err);notify('Error: '+err.message,'error');setLoading(false);}
            );
            return()=>unsub();
        },[]);

        const add=async()=>{
            if(!form.name||!form.code)return;
            setSaving(true);
            try{await col().add({...form,shared:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
                setShowAdd(false);setForm(EMPTY);notify('Script guardado ✓');}
            catch(e){notify('Error: '+e.message,'error');}
            setSaving(false);
        };
        const update=async()=>{
            if(!editing)return; setSaving(true);
            try{const{id,...d}=editing;await col().doc(id).update(d);setEditing(null);notify('Actualizado ✓');}
            catch(e){notify('Error: '+e.message,'error');}
            setSaving(false);
        };
        const del=async id=>{
            if(!confirm('¿Eliminar este script?'))return;
            try{await col().doc(id).delete();notify('Eliminado','info');}
            catch(e){notify('Error: '+e.message,'error');}
        };
        const share=async s=>{
            try{await col().doc(s.id).update({shared:!s.shared});notify(s.shared?'Ya no se comparte':'Compartido ✓');}
            catch(e){notify('Error: '+e.message,'error');}
        };
        const copy=(code,id)=>{navigator.clipboard.writeText(code);setCopied(id);setTimeout(()=>setCopied(null),2000);};

        const filtered=scripts.filter(s=>{
            const q=search.toLowerCase();
            return(s.name?.toLowerCase().includes(q)||s.description?.toLowerCase().includes(q)||s.code?.toLowerCase().includes(q))
                &&(cat==='Todos'||s.category===cat);
        });

        return <div style={{maxWidth:1200,margin:'0 auto',padding:'2rem 1rem'}}>
            {toast&&<Toast msg={toast.msg} type={toast.type}/>}

            <div style={{marginBottom:'2rem'}}>
                <h1 style={{fontSize:28,fontWeight:500,marginBottom:6}}>DAS Trader Scripts</h1>
                <p style={{fontSize:14,color:'var(--t1)'}}>Gestiona tus scripts — sincronizados en tiempo real con Firebase</p>
            </div>

            <div style={{display:'flex',gap:12,marginBottom:'1.5rem',flexWrap:'wrap',alignItems:'center'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:'var(--rM)',fontSize:13,
                    background:ready?'var(--bgS)':'var(--bgD)',color:ready?'var(--tS)':'var(--tD)'}}>
                    <Ico n="db"/> {ready?'Firebase conectado ✓':'Firebase no disponible ✗'}
                </div>
                <span style={{fontSize:13,color:'var(--t2)',marginLeft:'auto'}}>{scripts.length} scripts</span>
            </div>

            <div style={{display:'flex',gap:12,marginBottom:'1rem',flexWrap:'wrap'}}>
                <input placeholder="🔍 Buscar por nombre, descripción o código..."
                    value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:200}}/>
                <button onClick={()=>setShowAdd(true)} style={{display:'flex',alignItems:'center',gap:6,
                    padding:'0 20px',background:'var(--bgI)',color:'var(--tI)',border:'none',fontWeight:500}}>
                    <Ico n="plus"/> Agregar Script
                </button>
            </div>

            <div style={{display:'flex',gap:8,marginBottom:'1.5rem',flexWrap:'wrap'}}>
                {['Todos',...CATS].map(c=><button key={c} onClick={()=>setCat(c)} style={{
                    padding:'6px 14px',fontSize:13,borderRadius:'var(--rM)',
                    background:cat===c?'var(--bgI)':'var(--bg1)',
                    color:cat===c?'var(--tI)':'var(--t1)',
                    border:cat===c?'none':'.5px solid var(--b1)',
                    fontWeight:cat===c?500:400}}>{c}</button>)}
            </div>

            {loading?(
                <div style={{textAlign:'center',padding:'4rem',color:'var(--t1)'}}>⏳ Cargando desde Firebase...</div>
            ):filtered.length===0?(
                <div style={{textAlign:'center',padding:'4rem',color:'var(--t1)'}}>
                    {search||cat!=='Todos'?'No se encontraron scripts.':'¡Sin scripts aún! Pulsa "Agregar Script" para empezar.'}
                </div>
            ):(
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:16}}>
                    {filtered.map(s=><div key={s.id} style={{background:'var(--bg0)',border:'.5px solid var(--b1)',
                        borderRadius:'var(--rL)',padding:'1rem',display:'flex',flexDirection:'column',gap:12}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'start'}}>
                            <div style={{flex:1}}>
                                <h3 style={{fontSize:15,fontWeight:500,marginBottom:4}}>{s.name}</h3>
                                <span style={{fontSize:12,padding:'2px 8px',background:'var(--bgI)',
                                    color:'var(--tI)',borderRadius:'var(--rM)',display:'inline-block'}}>{s.category}</span>
                            </div>
                            {s.shared&&<span style={{fontSize:12,padding:'4px 8px',background:'var(--bgS)',
                                color:'var(--tS)',borderRadius:'var(--rM)'}}>↗️ Compartido</span>}
                        </div>
                        {s.description&&<p style={{fontSize:13,color:'var(--t1)',margin:0}}>{s.description}</p>}
                        <div style={{background:'var(--bg1)',padding:12,borderRadius:'var(--rM)',
                            fontFamily:'var(--mono)',fontSize:12,maxHeight:120,overflowY:'auto',overflowX:'auto'}}>
                            <code style={{whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{s.code}</code>
                        </div>
                        <div style={{display:'flex',gap:8,paddingTop:8,borderTop:'.5px solid var(--b1)'}}>
                            <button onClick={()=>copy(s.code,s.id)}
                                style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6,padding:8,fontSize:13}}>
                                {copied===s.id?'✓ Copiado':'📋 Copiar'}
                            </button>
                            <button onClick={()=>share(s)} style={{display:'flex',alignItems:'center',justifyContent:'center',padding:8,
                                background:s.shared?'var(--bgS)':'var(--bg0)',color:s.shared?'var(--tS)':'var(--t0)'}}>↗️</button>
                            <button onClick={()=>setEditing(s)}
                                style={{display:'flex',alignItems:'center',justifyContent:'center',padding:8}}>✏️</button>
                            <button onClick={()=>del(s.id)}
                                style={{display:'flex',alignItems:'center',justifyContent:'center',padding:8,color:'var(--tD)'}}>🗑️</button>
                        </div>
                    </div>)}
                </div>
            )}

            {showAdd&&<Modal title="Agregar Nuevo Script"
                onClose={()=>{setShowAdd(false);setForm(EMPTY);}}
                onSave={add} label={saving?'Guardando...':'Guardar Script'}
                disabled={!form.name||!form.code||saving}>
                <Form data={form} onChange={setForm}/>
            </Modal>}

            {editing&&<Modal title="Editar Script"
                onClose={()=>setEditing(null)}
                onSave={update} label={saving?'Guardando...':'Actualizar Script'}
                disabled={!editing.name||!editing.code||saving}>
                <Form data={editing} onChange={setEditing}/>
            </Modal>}
        </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
